<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post-Demo Call Intelligence</title>
<script>
  document.documentElement.dataset.theme = localStorage.getItem('ci-theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="logo">Call<span>Intel</span></div>
    <nav id="nav"></nav>
    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Toggle theme"><span id="theme-icon">☀</span></button>
    <div class="side-foot">Pipeline v1 · Run 2026-11-03<br><span id="run-status">Idle</span></div>
  </aside>
  <main>
    <div class="page-head">
      <div>
        <h2 id="page-title">Overview</h2>
        <p id="page-sub"></p>
      </div>
      <div id="page-actions"></div>
    </div>
    <div id="content"><div class="empty">Loading…</div></div>
  </main>
</div>

<!-- Transcript modal -->
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <div>
        <h3 id="modal-title">Transcript</h3>
        <p id="modal-sub" class="modal-sub"></p>
      </div>
      <button class="icon-btn" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
  </div>
</div>

<!-- Lead detail drawer -->
<div id="drawer-overlay" class="drawer-overlay hidden" onclick="closeDrawer()"></div>
<aside id="drawer" class="drawer hidden">
  <div class="drawer-head">
    <h3 id="drawer-title">Lead</h3>
    <button class="icon-btn" onclick="closeDrawer()">✕</button>
  </div>
  <div id="drawer-body" class="drawer-body"></div>
</aside>

<div id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
